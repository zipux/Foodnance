<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Private application surface: keep out of search results. The
       marketing page (public/index.html) is the only indexable page. -->
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>P&amp;L — DoughMeter</title>
  <link rel="stylesheet" href="/static/style.css?v=20260803-3" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    #pnl-page-marker { max-width: 780px; }

    /* Period picker — presets + a whole-month From/To range (mirrors the
       Home page's Spending Breakdown controls). */
    .pnl-periodbar {
      display: flex; flex-wrap: wrap; gap: .5rem .75rem;
      align-items: flex-end; margin-bottom: 1.25rem;
    }
    .pnl-presets { display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; }
    .pnl-preset-btn {
      padding: .28rem .65rem; font-size: .8rem; font-family: inherit; font-weight: 500;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: #fff; color: var(--text-muted); cursor: pointer;
      transition: var(--transition); white-space: nowrap;
    }
    .pnl-preset-btn:hover { border-color: var(--primary); color: var(--primary); }
    .pnl-preset-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .pnl-custom {
      display: flex; flex-wrap: wrap; gap: .4rem;
      align-items: flex-end; margin-left: auto;
    }
    .pnl-custom .form-group { gap: .15rem; min-width: 0; }
    .pnl-custom .form-group label { font-size: .72rem; color: var(--text-muted); }
    .pnl-custom input[type="month"] {
      padding: .28rem .55rem; border: 1px solid var(--border);
      border-radius: var(--radius-sm); font-family: inherit; font-size: .8rem;
      color: var(--text); background: #fff;
    }
    .pnl-custom input[type="month"]:focus {
      outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.1);
    }
    .pnl-apply-btn {
      padding: .28rem .75rem; font-size: .8rem; font-family: inherit; font-weight: 500;
      border: 1px solid var(--primary); border-radius: var(--radius-sm);
      background: var(--primary); color: #fff; cursor: pointer;
      white-space: nowrap; transition: var(--transition);
    }
    .pnl-apply-btn:hover { filter: brightness(1.08); }
    .pnl-nav-btn {
      width: 30px; height: 30px; border: 1px solid var(--border);
      border-radius: var(--radius-sm); background: #fff; color: var(--text-muted);
      cursor: pointer; font-size: .8rem; transition: var(--transition);
    }
    .pnl-nav-btn:hover { border-color: var(--primary); color: var(--primary); }
    .pnl-period-label {
      font-size: .8rem; color: var(--text-muted);
      margin-bottom: .9rem; padding-bottom: .6rem;
      border-bottom: 1px solid #f1f5f9;
    }
    .pnl-period-label strong { color: var(--text); font-weight: 600; }

    /* Cost-basis toggle (Purchases vs stock-take-adjusted True COGS) */
    .pnl-basis {
      display: flex; align-items: center; flex-wrap: wrap; gap: .5rem;
      margin: .1rem 0 1.1rem;
    }
    .pnl-basis-label { font-size: .78rem; color: var(--text-muted); font-weight: 600; }
    .pnl-basis-seg {
      display: inline-flex; border: 1px solid var(--border);
      border-radius: var(--radius-sm); overflow: hidden;
    }
    .pnl-basis-btn {
      padding: .3rem .7rem; font-size: .8rem; font-family: inherit; font-weight: 500;
      border: none; background: #fff; color: var(--text-muted);
      cursor: pointer; transition: var(--transition); white-space: nowrap;
    }
    .pnl-basis-btn + .pnl-basis-btn { border-left: 1px solid var(--border); }
    .pnl-basis-btn:hover:not(.active):not(:disabled) { color: var(--primary); }
    .pnl-basis-btn.active { background: var(--primary); color: #fff; }
    .pnl-basis-btn:disabled { color: #cbd5e1; cursor: not-allowed; }
    .pnl-basis-note {
      font-size: .74rem; color: var(--text-muted);
      display: flex; gap: .35rem; align-items: flex-start; flex-basis: 100%;
    }
    .pnl-basis-note i { margin-top: .12rem; }
    .pnl-basis-note.warn { color: #b45309; }

    /* Statement rows */
    .pnl-row {
      display: grid; grid-template-columns: 1fr auto auto;
      gap: .5rem 1rem; align-items: baseline;
      padding: .5rem .25rem; border-bottom: 1px solid #f1f5f9;
    }
    .pnl-label { font-size: .95rem; color: var(--text); }
    .pnl-sub   { font-size: .78rem; color: var(--text-muted); margin-top: .1rem; }
    /* Indented breakdown under a rolled-up line (e.g. what's inside Supplies) */
    .pnl-row-sub {
      padding: .3rem .25rem .3rem 1.4rem; border-bottom: 1px dashed #f1f5f9;
    }
    .pnl-row-sub .pnl-label,
    .pnl-row-sub .pnl-amount { font-size: .82rem; color: var(--text-muted); font-weight: 500; }
    /* Amber caution banner — used where a MISSING cost makes the P&L flattering,
       so it has to read louder than a .pnl-sub footnote. */
    .pnl-warn {
      display: flex; gap: .55rem; align-items: flex-start;
      background: #fffbeb; border: 1px solid #fde68a; color: #92400e;
      border-radius: 10px; padding: .6rem .75rem; margin: .5rem .25rem;
      font-size: .82rem; line-height: 1.45;
    }
    .pnl-warn i { margin-top: .15rem; }
    .pnl-warn a { color: #92400e; font-weight: 600; white-space: nowrap; }
    .pnl-amount {
      font-family: ui-monospace, monospace; font-weight: 600;
      font-size: .95rem; color: var(--text); text-align: right; white-space: nowrap;
    }
    .pnl-amount.neg { color: #dc2626; }
    .pnl-pct {
      font-size: .78rem; color: var(--text-muted);
      font-family: ui-monospace, monospace; text-align: right;
      min-width: 68px; white-space: nowrap;
    }
    .pnl-section-head {
      font-size: .72rem; font-weight: 700; letter-spacing: .04em;
      text-transform: uppercase; color: var(--text-muted);
      margin: 1.25rem 0 .35rem; padding: 0 .25rem;
    }
    .pnl-total {
      display: grid; grid-template-columns: 1fr auto auto;
      gap: .5rem 1rem; align-items: baseline;
      padding: .7rem .6rem; margin: .4rem 0;
      border-radius: var(--radius-sm); background: #f8fafc;
      border: 1px solid var(--border);
    }
    .pnl-total .pnl-label { font-weight: 700; font-size: 1rem; }
    .pnl-total .pnl-amount { font-size: 1.1rem; font-weight: 800; }
    .pnl-total.good { background: #f0fdf4; border-color: #bbf7d0; }
    .pnl-total.good .pnl-amount { color: #15803d; }
    .pnl-total.bad  { background: #fef2f2; border-color: #fecaca; }
    .pnl-total.bad  .pnl-amount { color: #b91c1c; }

    .pnl-money-in input {
      width: 150px; padding: .35rem .55rem; text-align: right;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-family: ui-monospace, monospace; font-size: .95rem; font-weight: 600;
      color: var(--text); background: #fff;
    }
    .pnl-money-in input:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79,70,229,.1);
    }

    .pnl-oh-row { display: grid; grid-template-columns: 1fr auto auto; gap: .5rem; align-items: center; padding: .3rem .25rem; }
    .pnl-oh-row input[type="text"] {
      padding: .35rem .55rem; border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-family: inherit; font-size: .9rem; color: var(--text); background: #fff; width: 100%;
    }
    .pnl-oh-row input[type="number"] {
      width: 130px; padding: .35rem .55rem; text-align: right;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-family: ui-monospace, monospace; font-size: .9rem; color: var(--text); background: #fff;
    }
    .pnl-oh-row input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.1); }
    .pnl-oh-del {
      background: none; border: none; color: #cbd5e1; cursor: pointer;
      font-size: .9rem; padding: .3rem; transition: var(--transition);
    }
    .pnl-oh-del:hover { color: #ef4444; }
    .pnl-oh-actions { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .6rem; }

    .pnl-plain {
      margin-top: 1.25rem; padding: .9rem 1.1rem;
      background: #eef2ff; border-radius: var(--radius-sm);
      font-size: .95rem; color: #3730a3; line-height: 1.5;
    }
    .pnl-note {
      margin-top: 1rem; font-size: .78rem; color: var(--text-muted);
      display: flex; gap: .4rem; align-items: flex-start;
    }
    .pnl-note i { margin-top: .15rem; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand"><i class="fas fa-receipt"></i> DoughMeter</div>
    <div class="nav-links">
      <a href="/home.html"><i class="fas fa-chart-line"></i> Price Movers</a>
      <a href="/upload-invoice.html"><i class="fas fa-file-invoice"></i> Upload Invoice</a>
      <a href="/invoices.html"><i class="fas fa-list-alt"></i> Invoices</a>
      <a href="/sales.html"><i class="fas fa-cash-register"></i> Sales</a>
      <a href="/pnl.html" class="active"><i class="fas fa-chart-pie"></i> P&amp;L</a>
      <a href="/products.html"><i class="fas fa-boxes"></i> Products</a>
      <a href="/recipes.html"><i class="fas fa-utensils"></i> Recipes</a>
      <a href="/finished-products.html"><i class="fas fa-tag"></i> Finished Products</a>
      <a href="/inventory.html"><i class="fas fa-warehouse"></i> Inventory</a>
      <a href="/suppliers.html"><i class="fas fa-truck"></i> Suppliers</a>
      <a href="/staff.html"><i class="fas fa-users"></i> Staff</a>
    </div>
  </nav>

  <div class="container" id="pnl-page-marker">
    <div class="page-header">
      <h1><i class="fas fa-chart-pie"></i> Profit &amp; Loss</h1>
      <p>What you took in, what it cost you, and what you kept — for any period.</p>
    </div>

    <div class="pnl-periodbar">
      <div class="pnl-presets">
        <button class="pnl-preset-btn" data-preset="this-month">This Month</button>
        <button class="pnl-preset-btn" data-preset="last-month">Last Month</button>
        <button class="pnl-preset-btn" data-preset="this-quarter">This Quarter</button>
        <button class="pnl-preset-btn" data-preset="ytd">Year to Date</button>
      </div>
      <div class="pnl-custom">
        <button class="pnl-nav-btn" id="pnlPrev" title="Previous period"><i class="fas fa-chevron-left"></i></button>
        <div class="form-group">
          <label>From</label>
          <input type="month" id="pnlFrom" />
        </div>
        <div class="form-group">
          <label>To</label>
          <input type="month" id="pnlTo" />
        </div>
        <button class="pnl-apply-btn" id="pnlApply">Apply</button>
        <button class="pnl-nav-btn" id="pnlNext" title="Next period"><i class="fas fa-chevron-right"></i></button>
      </div>
    </div>

    <section class="card">
      <div class="card-body" id="pnlBody">
        <div class="sb-empty" style="text-align:center;color:var(--text-muted);padding:2rem 1rem">
          <i class="fas fa-spinner fa-spin"></i> Loading…
        </div>
      </div>
    </section>
  </div>

  <!-- SPREAD COST MODAL -->
  <div class="modal-overlay hidden" id="spreadModal">
    <div class="modal" style="max-width:480px">
      <div class="modal-header">
        <h3 id="spreadModalTitle"><i class="fas fa-calendar-week"></i> Add spread cost</h3>
        <button class="modal-close" id="closeSpreadModal"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="spreadId" />
        <div class="form-group">
          <label>What is it? *</label>
          <input type="text" id="spreadName" placeholder="e.g. Waste disposal service" />
        </div>
        <div class="form-group" style="margin-top:.75rem">
          <label>Total amount ($) *</label>
          <input type="number" id="spreadTotal" step="0.01" min="0" placeholder="e.g. 400.00" />
        </div>
        <div class="form-grid" style="margin-top:.75rem">
          <div class="form-group">
            <label>Covers from *</label>
            <input type="date" id="spreadStart" />
          </div>
          <div class="form-group">
            <label>Covers to *</label>
            <input type="date" id="spreadEnd" />
          </div>
        </div>
        <div id="spreadPreview" style="margin-top:.9rem;font-size:.85rem;color:var(--text-muted)"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelSpreadModal">Cancel</button>
        <button class="btn btn-success" id="saveSpreadBtn"><i class="fas fa-save"></i> Save</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/static/utils.js?v=20260804-1"></script>
  <script src="/static/pnl.js?v=20260804-2"></script>
</body>
</html>
