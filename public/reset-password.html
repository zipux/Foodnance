<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password — Foodnance</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="theme-color" content="#0369a1" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,560;9..144,620&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* Standalone like login.html — does NOT load /static/style.css (app
       chrome). Tokens copied from :root there; keep in sync if they change. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:    #0369a1;
      --primary-d:  #075985;
      --nav-bg:     #0f172a;
      --border:     #e4e0d8;
      --text:       #171512;
      --text-muted: #6b6659;
      --radius-sm:  6px;
    }

    body {
      font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: linear-gradient(160deg, #f0f9ff 0%, #faf9f6 45%, #f3f1ec 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
      font-size: 16px; line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    .shell { width: 100%; max-width: 400px; }

    .brand {
      display: flex; align-items: center; justify-content: center; gap: .55rem;
      font-weight: 700; font-size: 1.3rem; letter-spacing: -.01em;
      color: var(--text); text-decoration: none; margin-bottom: 1.5rem;
    }
    .brand i { color: var(--primary); }

    .card {
      background: #fff; border: 1px solid var(--border);
      border-radius: 14px; padding: 2rem 1.75rem;
      box-shadow: 0 18px 48px rgba(15,23,42,.08);
    }
    .card h1 { font-family: 'Fraunces', Georgia, serif; font-size: 1.4rem; font-weight: 600; letter-spacing: -.01em; margin-bottom: .3rem; }
    .card .lede { font-size: .92rem; color: var(--text-muted); margin-bottom: 1.5rem; }

    label {
      display: block; font-size: .82rem; font-weight: 600;
      margin-bottom: .35rem; color: var(--text);
    }
    .field { margin-bottom: 1rem; }
    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%; font-family: inherit; font-size: .95rem;
      padding: .65rem .8rem; color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: #fff; transition: border-color .15s ease, box-shadow .15s ease;
    }
    input:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(3,105,161,.12);
    }

    button.submit {
      width: 100%; font-family: inherit; font-size: .98rem; font-weight: 600;
      padding: .75rem 1rem; border: none; border-radius: var(--radius-sm);
      color: #fff; cursor: pointer;
      background: var(--nav-bg);
      transition: background .15s ease;
      display: flex; align-items: center; justify-content: center; gap: .5rem;
      margin-top: .5rem;
    }
    button.submit:hover { background: #1e293b; }
    button.submit[disabled] { opacity: .65; cursor: default; }

    .error {
      display: none; margin-bottom: 1rem; padding: .7rem .85rem;
      background: #fef2f2; border: 1px solid #fecaca; border-radius: var(--radius-sm);
      font-size: .85rem; color: #991b1b;
      align-items: flex-start; gap: .5rem;
    }
    .error.show { display: flex; }
    .error i { margin-top: .15rem; }

    .invalid { text-align: center; color: var(--text-muted); font-size: .92rem; }
    .invalid i { font-size: 1.6rem; color: #94a3b8; margin-bottom: .75rem; display: block; }

    .back { display: block; text-align: center; margin-top: 1rem; font-size: .85rem; color: var(--text-muted); text-decoration: none; }
    .back:hover { color: var(--text); }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="shell">
    <div class="brand"><i class="fas fa-receipt"></i> Foodnance</div>

    <div class="card">
      <div id="loadingState">
        <p class="lede" style="text-align:center"><i class="fas fa-spinner fa-spin"></i> Checking your link…</p>
      </div>

      <div id="invalidState" class="hidden">
        <div class="invalid">
          <i class="fas fa-link-slash"></i>
          This reset link has expired or was already used.
          <p style="margin-top:.9rem"><a class="link" href="/login.html#forgot" style="color:var(--primary);font-weight:600;text-decoration:none">Request a new link</a></p>
        </div>
      </div>

      <div id="formState" class="hidden">
        <h1>Choose a new password</h1>
        <p class="lede">You'll be signed in as soon as it's saved.</p>

        <div class="error" id="resetError">
          <i class="fas fa-circle-exclamation"></i>
          <span id="resetErrorText"></span>
        </div>

        <form id="resetForm">
          <div class="field">
            <label for="password">New password</label>
            <input type="password" id="password" autocomplete="new-password" required minlength="8" placeholder="at least 8 characters" />
          </div>
          <div class="field">
            <label for="confirm">Confirm password</label>
            <input type="password" id="confirm" autocomplete="new-password" required placeholder="type it again" />
          </div>

          <button type="submit" class="submit">
            <i class="fas fa-key"></i> Save password
          </button>
        </form>
      </div>
    </div>

    <a class="back" href="/login.html"><i class="fas fa-arrow-left"></i> Back to log in</a>
  </div>

  <script>
    const token = new URLSearchParams(location.search).get('token') || '';

    const loadingState = document.getElementById('loadingState');
    const invalidState = document.getElementById('invalidState');
    const formState    = document.getElementById('formState');

    function showInvalid() {
      loadingState.classList.add('hidden');
      formState.classList.add('hidden');
      invalidState.classList.remove('hidden');
    }

    (async function checkLink() {
      if (!token) return showInvalid();
      try {
        const r = await fetch('/api/auth/reset-lookup', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ token }),
        });
        if (!r.ok) return showInvalid();
        loadingState.classList.add('hidden');
        formState.classList.remove('hidden');
      } catch (_) {
        showInvalid();
      }
    })();

    const form    = document.getElementById('resetForm');
    const errBox  = document.getElementById('resetError');
    const errText = document.getElementById('resetErrorText');

    function showError(msg) {
      errText.textContent = msg;
      errBox.classList.add('show');
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      errBox.classList.remove('show');

      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirm').value;
      if (password !== confirm) return showError('The two passwords do not match.');
      if (password.length < 8)  return showError('Password must be at least 8 characters.');

      const btn = form.querySelector('button.submit');
      const btnHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving…';

      try {
        const resp = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });
        const data = await resp.json().catch(() => ({}));
        if (resp.status === 404) return showInvalid();
        if (!resp.ok) {
          showError(data.error || 'Could not save the password. Please try again.');
          return;
        }
        // A super-admin has no organization, so the app has nothing to show them.
        location.href = (data.user && data.user.is_super_admin) ? '/admin.html' : '/home.html';
      } catch (_) {
        showError('Could not reach the server. Check your connection and try again.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = btnHtml;
      }
    });
  </script>

  <script src="/static/env-banner.js?v=20260807-2"></script>
</body>
</html>
