<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Private application surface: keep out of search results. The
       marketing page (public/index.html) is the only indexable page. -->
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Suppliers — DoughMeter</title>
  <link rel="stylesheet" href="/static/style.css?v=20260730-2" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand"><i class="fas fa-receipt"></i> DoughMeter</div>
    <div class="nav-links">
      <a href="/home.html"><i class="fas fa-chart-line"></i> Price Movers</a>
      <a href="/upload-invoice.html"><i class="fas fa-file-invoice"></i> Upload Invoice</a>
      <a href="/invoices.html"><i class="fas fa-list-alt"></i> Invoices</a>
      <a href="/sales.html"><i class="fas fa-cash-register"></i> Sales</a>
      <a href="/pnl.html"><i class="fas fa-chart-pie"></i> P&amp;L</a>
      <a href="/products.html"><i class="fas fa-boxes"></i> Products</a>
      <a href="/recipes.html"><i class="fas fa-utensils"></i> Recipes</a>
      <a href="/finished-products.html"><i class="fas fa-tag"></i> Finished Products</a>
      <a href="/inventory.html"><i class="fas fa-warehouse"></i> Inventory</a>
      <a href="/suppliers.html" class="active"><i class="fas fa-truck"></i> Suppliers</a>
      <a href="/staff.html"><i class="fas fa-users"></i> Staff</a>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <h1><i class="fas fa-truck"></i> Suppliers</h1>
      <p>Manage your vendor list. Suppliers are available as a dropdown when adding product entries.</p>
    </div>

    <section class="card">
      <div class="card-header">
        <h2><i class="fas fa-list"></i> Supplier List</h2>
        <div class="header-actions">
          <input type="text" id="supplierSearch" class="search-input" placeholder="Search suppliers…" />
          <button class="btn btn-primary" id="openAddSupplierBtn"><i class="fas fa-plus"></i> Add Supplier</button>
        </div>
      </div>
      <div class="card-body">
        <div class="table-scroll">
          <table class="data-table">
            <thead>
              <tr>
                <th>Supplier Name</th>
                <th>Contact</th>
                <th>Email</th>
                <th>Notes</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="supplierBody">
              <tr><td colspan="5" class="empty-row"><i class="fas fa-spinner fa-spin"></i> Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </div>

  <!-- ADD / EDIT SUPPLIER MODAL -->
  <div class="modal-overlay hidden" id="supplierModal">
    <div class="modal" style="max-width:480px">
      <div class="modal-header">
        <h3 id="supplierModalTitle">Add Supplier</h3>
        <button class="modal-close" id="closeSupplierModal"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editSupplierId" />
        <div class="form-group">
          <label>Supplier Name *</label>
          <input type="text" id="sName" placeholder="e.g. La Grotta Del Formaggio" />
        </div>
        <div class="form-group">
          <label>Contact</label>
          <input type="text" id="sContact" placeholder="e.g. John Smith / 04xx xxx xxx" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="sEmail" placeholder="e.g. orders@supplier.com" />
        </div>
        <div class="form-group">
          <label>Notes</label>
          <textarea id="sNotes" rows="2" placeholder="Any notes about this supplier…"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelSupplierModal">Cancel</button>
        <button class="btn btn-success" id="saveSupplierBtn"><i class="fas fa-save"></i> Save Supplier</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/static/utils.js?v=20260802-5"></script>
  <script src="/static/suppliers.js?v=20260714-1"></script>
</body>
</html>
