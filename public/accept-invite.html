<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join — DoughMeter</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="theme-color" content="#4f46e5" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* Standalone like login.html — does NOT load /static/style.css (app
       chrome). Tokens copied from :root there; keep in sync if they change. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:    #4f46e5;
      --primary-d:  #3730a3;
      --border:     #e2e8f0;
      --text:       #1e293b;
      --text-muted: #64748b;
      --radius-sm:  8px;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: linear-gradient(160deg, #eef2ff 0%, #f8fafc 45%, #f1f5f9 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
      font-size: 16px; line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .shell { width: 100%; max-width: 400px; }

    .brand {
      display: flex; align-items: center; justify-content: center; gap: .55rem;
      font-weight: 800; font-size: 1.3rem; letter-spacing: -.01em;
      color: var(--text); text-decoration: none; margin-bottom: 1.5rem;
    }
    .brand i { color: var(--primary); }

    .card {
      background: #fff; border: 1px solid var(--border);
      border-radius: 14px; padding: 2rem 1.75rem;
      box-shadow: 0 18px 48px rgba(15,23,42,.10);
    }
    .card h1 { font-size: 1.4rem; font-weight: 800; letter-spacing: -.02em; margin-bottom: .3rem; }
    .card .lede { font-size: .92rem; color: var(--text-muted); margin-bottom: 1.5rem; }

    label {
      display: block; font-size: .82rem; font-weight: 600;
      margin-bottom: .35rem; color: var(--text);
    }
    .field { margin-bottom: 1rem; }
    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%; font-family: inherit; font-size: .95rem;
      padding: .65rem .8rem; color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: #fff; transition: border-color .15s ease, box-shadow .15s ease;
    }
    input:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79,70,229,.12);
    }

    button.submit {
      width: 100%; font-family: inherit; font-size: .98rem; font-weight: 600;
      padding: .75rem 1rem; border: none; border-radius: var(--radius-sm);
      color: #fff; cursor: pointer;
      background: linear-gradient(180deg, var(--primary), var(--primary-d));
      box-shadow: 0 2px 10px rgba(79,70,229,.28);
      transition: transform .15s ease, box-shadow .15s ease;
      display: flex; align-items: center; justify-content: center; gap: .5rem;
      margin-top: .5rem;
    }
    button.submit:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(79,70,229,.34); }
    button.submit[disabled] { opacity: .65; cursor: default; transform: none; }

    .error {
      display: none; margin-bottom: 1rem; padding: .7rem .85rem;
      background: #fef2f2; border: 1px solid #fecaca; border-radius: var(--radius-sm);
      font-size: .85rem; color: #991b1b;
      align-items: flex-start; gap: .5rem;
    }
    .error.show { display: flex; }
    .error i { margin-top: .15rem; }

    .invalid { text-align: center; color: var(--text-muted); font-size: .92rem; }
    .invalid i { font-size: 1.6rem; color: #94a3b8; margin-bottom: .75rem; display: block; }

    .back { display: block; text-align: center; margin-top: 1rem; font-size: .85rem; color: var(--text-muted); text-decoration: none; }
    .back:hover { color: var(--text); }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="shell">
    <div class="brand"><i class="fas fa-receipt"></i> DoughMeter</div>

    <div class="card">
      <div id="loadingState">
        <p class="lede" style="text-align:center"><i class="fas fa-spinner fa-spin"></i> Checking your invite…</p>
      </div>

      <div id="invalidState" class="hidden">
        <div class="invalid">
          <i class="fas fa-link-slash"></i>
          This invite link is no longer valid. Ask whoever sent it for a new one.
        </div>
      </div>

      <div id="formState" class="hidden">
        <h1>Join <span id="orgNameText"></span></h1>
        <p class="lede">Set your name and password to get started.</p>

        <div class="error" id="acceptError">
          <i class="fas fa-circle-exclamation"></i>
          <span id="acceptErrorText"></span>
        </div>

        <form id="acceptForm">
          <div class="field">
            <label for="name">Your name</label>
            <input type="text" id="name" autocomplete="name" placeholder="e.g. Maria Rossi" />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="username" required placeholder="you@yourbusiness.com" />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="new-password" required minlength="8" placeholder="at least 8 characters" />
          </div>
          <div class="field">
            <label for="confirm">Confirm password</label>
            <input type="password" id="confirm" autocomplete="new-password" required placeholder="type it again" />
          </div>

          <button type="submit" class="submit">
            <i class="fas fa-arrow-right-to-bracket"></i> Join
          </button>
        </form>
      </div>
    </div>

    <a class="back" href="/login.html"><i class="fas fa-arrow-left"></i> Already have an account? Log in</a>
  </div>

  <script>
    const token = new URLSearchParams(location.search).get('token') || '';

    const loadingState = document.getElementById('loadingState');
    const invalidState = document.getElementById('invalidState');
    const formState     = document.getElementById('formState');

    function showInvalid() {
      loadingState.classList.add('hidden');
      formState.classList.add('hidden');
      invalidState.classList.remove('hidden');
    }

    (async function checkInvite() {
      if (!token) return showInvalid();
      try {
        const r = await fetch('/api/invites/lookup', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ token }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) return showInvalid();

        document.getElementById('orgNameText').textContent = data.org_name || '';
        if (data.email) document.getElementById('email').value = data.email;
        if (data.name)  document.getElementById('name').value  = data.name;

        loadingState.classList.add('hidden');
        formState.classList.remove('hidden');
      } catch (_) {
        showInvalid();
      }
    })();

    const form    = document.getElementById('acceptForm');
    const errBox  = document.getElementById('acceptError');
    const errText = document.getElementById('acceptErrorText');

    function showError(msg) {
      errText.textContent = msg;
      errBox.classList.add('show');
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      errBox.classList.remove('show');

      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirm').value;
      if (password !== confirm) return showError('The two passwords do not match.');
      if (password.length < 8)  return showError('Password must be at least 8 characters.');

      const btn = form.querySelector('button.submit');
      const btnHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Joining…';

      try {
        const resp = await fetch('/api/auth/accept-invite', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            token,
            name:     document.getElementById('name').value.trim(),
            email:    document.getElementById('email').value.trim(),
            password,
          }),
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) {
          showError(data.error || 'Could not complete sign-up. Please try again.');
          return;
        }
        location.href = '/home.html';
      } catch (_) {
        showError('Could not reach the server. Check your connection and try again.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = btnHtml;
      }
    });
  </script>

  <script src="/static/env-banner.js?v=20260807-2"></script>
</body>
</html>
