<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — Foodnance</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="theme-color" content="#4f46e5" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* Standalone like landing.html — does NOT load /static/style.css (app chrome).
       Tokens copied from :root there; keep in sync if --primary changes. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:    #4f46e5;
      --primary-d:  #3730a3;
      --border:     #e2e8f0;
      --text:       #1e293b;
      --text-muted: #64748b;
      --radius-sm:  8px;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: linear-gradient(160deg, #eef2ff 0%, #f8fafc 45%, #f1f5f9 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
      font-size: 16px; line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .shell { width: 100%; max-width: 400px; }

    .brand {
      display: flex; align-items: center; justify-content: center; gap: .55rem;
      font-weight: 800; font-size: 1.3rem; letter-spacing: -.01em;
      color: var(--text); text-decoration: none; margin-bottom: 1.5rem;
    }
    .brand i { color: var(--primary); }

    .card {
      background: #fff; border: 1px solid var(--border);
      border-radius: 14px; padding: 2rem 1.75rem;
      box-shadow: 0 18px 48px rgba(15,23,42,.10);
    }
    .card h1 { font-size: 1.4rem; font-weight: 800; letter-spacing: -.02em; margin-bottom: .3rem; }
    .card .lede { font-size: .92rem; color: var(--text-muted); margin-bottom: 1.5rem; }

    label {
      display: block; font-size: .82rem; font-weight: 600;
      margin-bottom: .35rem; color: var(--text);
    }
    .field { margin-bottom: 1rem; }
    input[type="email"], input[type="password"] {
      width: 100%; font-family: inherit; font-size: .95rem;
      padding: .65rem .8rem; color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: #fff; transition: border-color .15s ease, box-shadow .15s ease;
    }
    input:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79,70,229,.12);
    }

    .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
    .remember { display: flex; align-items: center; gap: .4rem; font-size: .85rem; color: var(--text-muted); }
    .remember input { accent-color: var(--primary); }
    .link { font-size: .85rem; color: var(--primary); text-decoration: none; font-weight: 500; }
    .link:hover { text-decoration: underline; }

    button.submit {
      width: 100%; font-family: inherit; font-size: .98rem; font-weight: 600;
      padding: .75rem 1rem; border: none; border-radius: var(--radius-sm);
      color: #fff; cursor: pointer;
      background: linear-gradient(180deg, var(--primary), var(--primary-d));
      box-shadow: 0 2px 10px rgba(79,70,229,.28);
      transition: transform .15s ease, box-shadow .15s ease;
      display: flex; align-items: center; justify-content: center; gap: .5rem;
    }
    button.submit:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(79,70,229,.34); }

    /* Sign-in failure message. Hidden until the server rejects a login. */
    .error {
      display: none; margin-bottom: 1rem; padding: .7rem .85rem;
      background: #fef2f2; border: 1px solid #fecaca; border-radius: var(--radius-sm);
      font-size: .85rem; color: #991b1b;
      align-items: flex-start; gap: .5rem;
    }
    .error.show { display: flex; }
    .error i { margin-top: .15rem; }
    button.submit[disabled] { opacity: .65; cursor: default; transform: none; }

    .below { text-align: center; margin-top: 1.5rem; font-size: .88rem; color: var(--text-muted); }
    .below a { color: var(--primary); text-decoration: none; font-weight: 500; }
    .below a:hover { text-decoration: underline; }
    .back { display: block; text-align: center; margin-top: 1rem; font-size: .85rem; color: var(--text-muted); text-decoration: none; }
    .back:hover { color: var(--text); }
  </style>
</head>
<body>

  <div class="shell">
    <a class="brand" href="/"><i class="fas fa-receipt"></i> Foodnance</a>

    <div class="card">
      <h1>Log in</h1>
      <p class="lede">Welcome back. Pick up where you left off.</p>

      <div class="error" id="loginError">
        <i class="fas fa-circle-exclamation"></i>
        <span id="loginErrorText"></span>
      </div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="username" required
                 placeholder="you@yourbusiness.com" />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required
                 placeholder="••••••••" />
        </div>

        <div class="row">
          <label class="remember"><input type="checkbox" id="remember" /> Remember me</label>
          <a class="link" href="mailto:hello@foodnance.com?subject=Foodnance%20—%20password%20help">Forgot password?</a>
        </div>

        <button type="submit" class="submit">
          <i class="fas fa-arrow-right-to-bracket"></i> Log in
        </button>
      </form>

    </div>

    <p class="below">Don't have an account?
      <a href="mailto:hello@foodnance.com?subject=Foodnance%20—%20request%20access&body=Hi%20Simone%2C%0A%0AI%27d%20like%20early%20access%20to%20Foodnance.%0A%0ABusiness%20name%3A%20%0AType%20(restaurant%20%2F%20bakery%20%2F%20commissary)%3A%20%0ARough%20number%20of%20invoices%20per%20week%3A%20%0A%0AThanks!">Request access</a>
    </p>
    <a class="back" href="/"><i class="fas fa-arrow-left"></i> Back to homepage</a>
  </div>

  <script>
    // Real sign-in. The server replies with a signed HttpOnly session cookie,
    // which the browser then sends on every /api/* request automatically —
    // there is nothing to store here, and no token JavaScript can read.
    // The .html suffix is deliberate and matches every other internal link in
    // the app. Cloudflare Pages strips it and 308-redirects in production, so
    // these still land on /home and /admin there; without it they 404 under
    // `npm run dev`, which serves files as they are. Logging in and being
    // bounced straight to a 404 is a bad first thirty seconds of local testing.
    const AFTER_LOGIN        = '/home.html';           // Price Movers, first tab in the app
    const AFTER_LOGIN_ADMIN  = '/admin.html';          // super-admin goes to the admin screen
    const AFTER_LOGIN_MOBILE = '/upload-invoice.html'; // on a phone, the only job is photographing a delivery note

    // A phone is a capture device, not a reporting one: someone signing in on
    // one is standing at a delivery, not reading Price Movers. Land them on the
    // camera. Requires BOTH a small screen and a touch pointer, so a desktop
    // window dragged narrow is not mistaken for a phone. If matchMedia or the
    // pointer feature is missing, this is false and everyone gets /home — the
    // wrong guess costs a tap on the navbar, so it fails toward the old
    // behaviour. Note /upload-invoice is deliberately NOT plan-gated, so this
    // is safe to send an Essential account to.
    function isHandheld() {
      try {
        return window.matchMedia('(max-width: 900px) and (pointer: coarse)').matches;
      } catch (_) { return false; }
    }

    // If the session expired mid-task, utils.js sends the user here with
    // ?next=/wherever — return them there instead of dumping them on /home.
    // Only same-site paths are honoured, so ?next=https://evil.example can't
    // turn this page into an open redirect.
    function destinationFor(user) {
      const next = new URLSearchParams(location.search).get('next') || '';
      if (next.startsWith('/') && !next.startsWith('//')) return next;
      // Super-admin first: they have no org, so the upload screen has nothing
      // to file an invoice against until they pick an account to view as.
      if (user && user.is_super_admin) return AFTER_LOGIN_ADMIN;
      return isHandheld() ? AFTER_LOGIN_MOBILE : AFTER_LOGIN;
    }

    const form    = document.getElementById('loginForm');
    const errBox  = document.getElementById('loginError');
    const errText = document.getElementById('loginErrorText');
    const btn     = form.querySelector('button.submit');
    const btnHtml = btn.innerHTML;

    function showError(msg) {
      errText.textContent = msg;
      errBox.classList.add('show');
    }

    // Already signed in? Skip the form entirely.
    fetch('/api/auth/me')
      .then(r => r.ok ? r.json() : null)
      .then(d => { if (d && d.user) location.href = destinationFor(d.user); })
      .catch(() => {});

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      errBox.classList.remove('show');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in…';

      try {
        const resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            email:    document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        const data = await resp.json().catch(() => ({}));

        if (!resp.ok) {
          showError(data.error || 'Could not sign in. Please try again.');
          return;
        }
        // Back to where they were if the session expired mid-task, else
        // admin screen for super-admins and the app for everyone else.
        location.href = destinationFor(data.user);
      } catch (_) {
        showError('Could not reach the server. Check your connection and try again.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = btnHtml;
      }
    });
  </script>

  <script src="/static/env-banner.js?v=20260807-2"></script>
</body>
</html>
