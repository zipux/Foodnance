<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Cloudflare Pages serves this file, with a real 404 status, for any
       address that isn't a page or a file. Without it Pages treats the site as a
       single-page app and answers every wrong address with the homepage and a
       200, which search engines read as thousands of duplicate homepages.
       Standalone on purpose, like index.html: no shared CSS, no scripts. -->
  <meta name="robots" content="noindex, nofollow" />
  <title>Page not found — Foodnance</title>
  <meta name="theme-color" content="#0369a1" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,560;9..144,620&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #0369a1; --primary-d: #075985; --nav-bg: #0f172a;
      --border: #e4e0d8; --text: #171512; --text-muted: #6b6659; --bg-alt: #f3f1ec;
    }
    body {
      font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
      color: var(--text); background: #faf9f6; line-height: 1.65;
      min-height: 100vh; display: flex; flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    header { border-bottom: 1px solid var(--border); padding: .85rem 1.25rem; }
    .brand { font-weight: 700; font-size: 1.15rem; letter-spacing: -.01em; color: var(--text); text-decoration: none; }
    main {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 3rem 1.25rem;
    }
    .code {
      font-family: 'Fraunces', Georgia, serif;
      font-size: clamp(4rem, 14vw, 7rem); font-weight: 600; line-height: 1; letter-spacing: -.01em;
      color: var(--primary);
      margin-bottom: 1rem;
    }
    h1 { font-family: 'Fraunces', Georgia, serif; font-size: clamp(1.35rem, 4vw, 1.75rem); font-weight: 600; letter-spacing: -.01em; margin-bottom: .6rem; }
    p { color: var(--text-muted); max-width: 44ch; margin: 0 auto 1.6rem; }
    .btn {
      display: inline-block; font-weight: 600; font-size: .95rem; text-decoration: none;
      color: #fff; padding: .75rem 1.4rem; border-radius: 6px;
      background: var(--nav-bg);
    }
    .btn:hover { background: #1e293b; }
    .btn:focus-visible { outline: 2px solid var(--primary-d); outline-offset: 2px; }
    .login { display: block; margin-top: 1rem; font-size: .9rem; color: var(--primary); font-weight: 600; text-decoration: none; }
    .login:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header><a class="brand" href="/">Foodnance</a></header>
  <main>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you were looking for doesn't exist, or it has moved. Check the address, or head back to the homepage.</p>
    <a class="btn" href="/">Back to the homepage</a>
    <a class="login" href="/login">Log in to your account</a>
  </main>
</body>
</html>
